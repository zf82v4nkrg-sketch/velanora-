<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Velanora — Monster Catching RPG</title>
<style>
:root{--ink:#13243c;--glass:rgba(10,24,45,.88);--line:rgba(255,255,255,.2);--mint:#8ff2c5;--gold:#ffd77a}*{box-sizing:border-box}body{margin:0;background:#091626;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}#game{display:block;width:100vw;height:100dvh;touch-action:none;background:#8cc8e8}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #06102055;backdrop-filter:blur(8px)}#brand{position:absolute;top:14px;left:14px;padding:10px 14px;font-weight:900;letter-spacing:.08em;font-size:clamp(14px,2vw,20px)}#brand small{display:block;font-size:10px;letter-spacing:.16em;color:#b9d6f1;font-weight:600}#status{position:absolute;top:14px;right:14px;padding:10px 13px;min-width:130px;font-size:12px}#status strong{font-size:14px;display:block}#status .bar{height:7px;background:#31455a;border-radius:9px;overflow:hidden;margin-top:6px}#status .bar span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5ce0a0,#b9f2a0)}#quest{position:absolute;left:14px;top:92px;padding:10px 12px;max-width:220px;font-size:12px;color:#dceafa}#quest b{color:var(--gold)}#message{position:absolute;left:50%;bottom:106px;transform:translateX(-50%);width:min(520px,calc(100vw - 24px));padding:12px 16px;text-align:center;font-size:14px;pointer-events:none}#buttons{position:absolute;right:14px;bottom:16px;display:grid;grid-template-columns:repeat(2,minmax(82px,110px));gap:8px;pointer-events:auto}.ui-btn{border:1px solid #ffffff35;background:#102a48eF;color:#fff;border-radius:12px;padding:11px 12px;font-weight:750;box-shadow:0 4px 0 #06101c;cursor:pointer}.ui-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #06101c}.ui-btn.primary{background:linear-gradient(135deg,#2b9c8b,#216c91);border-color:#8ff2c5}.ui-btn:disabled{opacity:.4}#movePad{position:absolute;left:18px;bottom:20px;display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px;gap:5px;pointer-events:auto}#movePad button{background:#102a48d9;border:1px solid #ffffff35;border-radius:12px;color:white;font-size:18px;font-weight:bold;touch-action:none}#movePad .up{grid-column:2}#movePad .left{grid-column:1;grid-row:2}#movePad .down{grid-column:2;grid-row:2}#movePad .right{grid-column:3;grid-row:2}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#061020a8;z-index:5}.modal{width:min(540px,100%);max-height:85dvh;overflow:auto;padding:20px;background:linear-gradient(160deg,#183454,#0d1d32);border:1px solid #ffffff2e;border-radius:20px;box-shadow:0 18px 70px #0008}.modal h2{margin:0 0 6px}.muted{color:#bdd0e5;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:15px 0}.creature{padding:12px;border:1px solid #ffffff24;border-radius:14px;background:#ffffff08}.creature .emoji{font-size:38px}.creature b{display:block}.creature small{color:#c5d7e8}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.battle-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.health{height:9px;background:#34465b;border-radius:9px;overflow:hidden;margin-top:7px}.health span{height:100%;display:block;background:#71e2a7}.battlefield{min-height:145px;display:flex;align-items:center;justify-content:space-around;font-size:68px}.battlefield .player{filter:drop-shadow(0 10px 4px #0005)}.battlefield .wild{filter:drop-shadow(0 10px 4px #0005)}#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#122844f5;padding:14px 18px;border:1px solid #ffffff35;border-radius:14px;display:none;z-index:8;text-align:center;max-width:85vw}#help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;color:#f4f8ffbb;text-shadow:0 1px 3px #000;white-space:nowrap} @media(max-width:650px){#quest{top:78px;max-width:160px;font-size:11px}#status{top:75px;min-width:112px}#message{bottom:130px;font-size:12px}#buttons{grid-template-columns:repeat(2,85px);right:10px;bottom:10px}.ui-btn{padding:10px 8px;font-size:12px}#movePad{left:10px;bottom:12px;grid-template-columns:37px 37px 37px;grid-template-rows:37px 37px}#help{display:none}#brand{top:10px;left:10px}}
</style></head>
<body>
<canvas id="game" aria-label="Velanora game world"></canvas>
<div id="hud"><div id="brand" class="panel">✦ VELANORA <small>CATCH · TRAIN · EXPLORE</small></div><div id="status" class="panel"><strong>Trainer · Lv. 1</strong><span id="teamCount">Team 1/6</span><div class="bar"><span></span></div><small id="coins">✦ 20 shards</small></div><div id="quest" class="panel"><b>FIRST STEPS</b><br>Explore the meadow and meet your first wild creature.<br><span id="questProgress">Wildlife discovered: 0</span></div><div id="message" class="panel">Welcome to Velanora! Wander through the meadow to discover wild creatures.</div><div id="movePad"><button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="right" data-move="right">▶</button></div><div id="buttons"><button class="ui-btn primary" id="interact">✦ Interact</button><button class="ui-btn" id="teamBtn">♡ Team</button><button class="ui-btn" id="bagBtn">▣ Bag</button><button class="ui-btn" id="mapBtn">⌖ Map</button></div><div id="help">WASD / ARROWS to move · SPACE to interact · M map · T team</div></div>
<div class="overlay" id="modalOverlay"><div class="modal" id="modal"></div></div><div id="toast"></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const player={x:0,y:0,dir:0,step:0};let keys={},last=0,encounterMeter=0,modalOpen=false,worldName='Moonpetal Meadow',found=0,caught=0,coins=20,items={orbs:5,berries:2},battle=null;let team=[{name:'Cindercub',kind:'Fire',emoji:'🦊',level:5,hp:24,maxHp:24,atk:7,xp:0}];
const species=[{name:'Mossling',kind:'Leaf',emoji:'🦌',level:3,hp:18,atk:5,color:'#8cce9d'},{name:'Fluffin',kind:'Water',emoji:'🐰',level:2,hp:16,atk:4,color:'#9ed8f4'},{name:'Emberkit',kind:'Fire',emoji:'🐱',level:4,hp:20,atk:6,color:'#ffb06b'},{name:'Duskit',kind:'Shadow',emoji:'🦇',level:5,hp:22,atk:7,color:'#c1a7ef'},{name:'Pebblit',kind:'Earth',emoji:'🐢',level:3,hp:19,atk:5,color:'#d3bd86'},{name:'Breezlet',kind:'Air',emoji:'🐦',level:2,hp:15,atk:4,color:'#b4e9e7'}];
let grass=[],flowers=[],trees=[],rocks=[],sparkles=[];function rand(a,b){return Math.random()*(b-a)+a}for(let i=0;i<180;i++)grass.push({x:rand(-1100,1100),y:rand(-900,900),h:rand(5,17),c:['#3c9b69','#4aa874','#65b77b','#2f895f'][i%4]});for(let i=0;i<90;i++)flowers.push({x:rand(-1000,1000),y:rand(-850,850),c:['#ffe5a4','#f5b7d2','#e8f4d1','#b9c6ff'][i%4],r:rand(2,4)});for(let i=0;i<55;i++)trees.push({x:rand(-1000,1000),y:rand(-900,900),s:rand(.65,1.35),type:i%3});for(let i=0;i<22;i++)rocks.push({x:rand(-850,850),y:rand(-700,700),s:rand(.6,1.4)});
function sx(x,y){return W/2+(x-player.x)*1.05+(y-player.y)*.18}function sy(x,y){return H/2+(y-player.y)*.72}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawTree(t){let x=sx(t.x,t.y),y=sy(t.x,t.y);if(x<-100||x>W+100||y<-160||y>H+100)return;ctx.save();ctx.translate(x,y);ctx.scale(t.s,t.s);ellipse(0,7,24,8,'#27674866');ctx.fillStyle='#75543b';ctx.fillRect(-5,-30,10,37);let colors=t.type===0?['#247650','#328b59','#4aab6c']:t.type===1?['#2d6f65','#358c79','#55ad8b']:['#36784a','#47975a','#68b56c'];ellipse(0,-42,27,34,colors[0]);ellipse(-13,-52,19,24,colors[1]);ellipse(13,-55,20,25,colors[2]);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#7bc2ef');sky.addColorStop(.45,'#c6e9f2');sky.addColorStop(.46,'#70c18a');sky.addColorStop(1,'#318b62');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H); // distant mountains
ctx.fillStyle='#7caec4';ctx.beginPath();ctx.moveTo(0,H*.46);for(let x=0;x<=W+100;x+=100)ctx.lineTo(x,H*.34+Math.sin(x*.013)*27+Math.sin(x*.03)*12);ctx.lineTo(W,H*.52);ctx.lineTo(0,H*.52);ctx.fill();ctx.fillStyle='#d2eef1';for(let x=-20;x<W+100;x+=190){ctx.beginPath();ctx.moveTo(x,H*.37);ctx.lineTo(x+28,H*.31);ctx.lineTo(x+53,H*.38);ctx.lineTo(x+36,H*.35);ctx.lineTo(x+25,H*.36);ctx.fill()}
// path winding through field
ctx.beginPath();ctx.moveTo(W*.15,H+50);ctx.bezierCurveTo(W*.12,H*.7,W*.72,H*.83,W*.63,H*.49);ctx.bezierCurveTo(W*.6,H*.25,W*.3,H*.42,W*.4,H*.2);ctx.lineWidth=72;ctx.strokeStyle='#d6c49b';ctx.stroke();ctx.lineWidth=5;ctx.strokeStyle='#eadbb5';ctx.stroke();
for(const g of grass){let x=sx(g.x,g.y),y=sy(g.x,g.y);if(x<0||x>W||y<0||y>H)continue;ctx.strokeStyle=g.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+3);ctx.quadraticCurveTo(x-3,y-g.h/2,x+rand(-3,3),y-g.h);ctx.stroke()}for(const f of flowers){let x=sx(f.x,f.y),y=sy(f.x,f.y);if(x<0||x>W||y<0||y>H)continue;ellipse(x,y,f.r,f.r,f.c)}for(const r of rocks){let x=sx(r.x,r.y),y=sy(r.x,r.y);if(x<0||x>W||y<0||y>H)continue;ellipse(x,y,10*r.s,6*r.s,'#526f6a');ellipse(x-2*r.s,y-3*r.s,7*r.s,5*r.s,'#8da7a0')}
// little pond
let px=sx(210,-155),py=sy(210,-155);ellipse(px,py,92,44,'#57c9e3');ellipse(px-5,py-5,75,28,'#8ee7ed');ctx.strokeStyle='#b7f4ef';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(px-5,py-5,65,21,.1,0,2.8);ctx.stroke();
for(const t of trees)drawTree(t);
// signpost
let signx=sx(-150,90),signy=sy(-150,90);ctx.fillStyle='#765037';ctx.fillRect(signx-3,signy-24,6,31);ctx.fillStyle='#f2d59b';ctx.fillRect(signx-19,signy-29,38,14);ctx.fillStyle='#795d3d';ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillText('MEADOW',signx,signy-19);
// player shadow and avatar
let x=W/2,y=H/2+10;ellipse(x,y+18,16,7,'#173d3b66');ctx.fillStyle='#3e2c25';ctx.beginPath();ctx.ellipse(x,y+9,6,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f2c4a0';ellipse(x,y-8,9,10,'#f2c4a0');ellipse(x,y-13,10,8,'#5b3c2f');ctx.fillStyle='#5b3c2f';ctx.beginPath();ctx.arc(x,y-11,10,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#f6f5fa';ctx.fillRect(x-8,y,16,15);ctx.fillStyle='#4a79b5';ctx.fillRect(x-8,y+14,7,11);ctx.fillRect(x+1,y+14,7,11);ctx.fillStyle='#e8f6ff';ctx.fillRect(x-13,y+1,5,12);ctx.fillRect(x+8,y+1,5,12);
// occasional ambient fireflies
if(Math.random()<.22)sparkles.push({x:rand(0,W),y:rand(H*.3,H),life:1});sparkles=sparkles.filter(s=>s.life>0);for(let s of sparkles){ellipse(s.x,s.y,2,2,'#fff6b8');s.life-=.018}
// place labels
ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillStyle='#fff';ctx.shadowColor='#234';ctx.shadowBlur=5;ctx.fillText('MOONPETAL MEADOW',W/2,H*.16);ctx.shadowBlur=0;requestAnimationFrame(draw)}draw();
function say(s){document.getElementById('message').textContent=s}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1700)}function updateHud(){document.getElementById('teamCount').textContent=`Team ${team.length}/6`;document.getElementById('coins').textContent=`✦ ${coins} shards`;document.getElementById('questProgress').textContent=`Wildlife discovered: ${found} · Caught: ${caught}`;document.querySelector('#status .bar span').style.width=Math.max(0,team[0].hp/team[0].maxHp*100)+'%'}
function move(dx,dy){if(modalOpen)return;player.x=Math.max(-650,Math.min(650,player.x+dx));player.y=Math.max(-580,Math.min(580,player.y+dy));player.step++;encounterMeter+=Math.hypot(dx,dy);if(encounterMeter>100&&Math.random()<.36){encounterMeter=0;startBattle() }else if(encounterMeter>160){encounterMeter=0;startBattle()}else if(player.step%7===0){say(['The meadow breeze smells like rain and wildflowers.','You spot tiny glowing tracks beside the path.','Somewhere nearby, a creature rustles in the tall grass.','The hills beyond the meadow look worth exploring.'][Math.floor(Math.random()*4)])}}
function startBattle(){if(modalOpen)return;let s=species[Math.floor(Math.random()*species.length)],lv=Math.max(2,s.level+Math.floor(Math.random()*3));battle={wild:{...s,level:lv,maxHp:s.hp+(lv-s.level)*3,hp:s.hp+(lv-s.level)*3,atk:s.atk+Math.floor((lv-s.level)/2)},turn:'player'};found++;updateHud();showBattle()}
function showModal(html){modalOpen=true;document.getElementById('modal').innerHTML=html;document.getElementById('modalOverlay').style.display='flex'}function closeModal(){modalOpen=false;document.getElementById('modalOverlay').style.display='none'}
function showBattle(){if(!battle)return;const w=battle.wild,p=team[0];showModal(`<div class="battle-top"><div><b>WILD ${w.name.toUpperCase()}</b><div class="muted">Lv. ${w.level} · ${w.kind}</div><div class="health"><span style="width:${100*w.hp/w.maxHp}%;background:#f3c66e"></span></div></div><div style="text-align:right"><b>${p.name}</b><div class="muted">Lv. ${p.level} · ${p.kind}</div><div class="health"><span style="width:${100*p.hp/p.maxHp}%"></span></div><small>${p.hp}/${p.maxHp} HP</small></div></div><div class="battlefield"><span class="wild">${w.emoji}</span><span style="font-size:26px;color:#9dc7e7">VS</span><span class="player">${p.emoji}</span></div><p class="muted" id="battleText">A wild ${w.name} appeared! What will you do?</p><div class="actions"><button class="ui-btn primary" id="attackBtn">⚔️ Quick Strike</button><button class="ui-btn" id="orbBtn">🔮 Catch Orb (${items.orbs})</button><button class="ui-btn" id="berryBtn">🍓 Use Berry (${items.berries})</button><button class="ui-btn" id="runBtn">↗ Run Away</button></div>`);document.getElementById('attackBtn').onclick=attack;document.getElementById('orbBtn').onclick=catchWild;document.getElementById('berryBtn').onclick=heal;document.getElementById('runBtn').onclick=()=>{battle=null;closeModal();say('You slipped away safely. The meadow is quiet again.')}}
function attack(){if(!battle)return;let p=team[0],w=battle.wild;let damage=p.atk+Math.floor(Math.random()*4);w.hp=Math.max(0,w.hp-damage);if(w.hp<=0){p.xp+=10;coins+=3;if(p.xp>=20){p.xp-=20;p.level++;p.maxHp+=4;p.hp=p.maxHp;p.atk++;toast(`${p.name} reached level ${p.level}!`)}battle=null;closeModal();say(`Victory! Your ${p.name} earned 10 XP and you found 3 shards.`);updateHud();return}let hurt=w.atk+Math.floor(Math.random()*3);p.hp=Math.max(0,p.hp-hurt);if(p.hp<=0){p.hp=1;toast(`${p.name} is tired, but still standing!`)}updateHud();showBattle();document.getElementById('battleText').textContent=`${p.name} dealt ${damage} damage. Wild ${w.name} struck back for ${hurt}!`}
function catchWild(){if(!battle)return;if(items.orbs<=0){toast('You are out of Catch Orbs!');return}items.orbs--;let w=battle.wild;let chance=.34+(1-w.hp/w.maxHp)*.52;if(Math.random()<chance){let c={name:w.name,kind:w.kind,emoji:w.emoji,level:w.level,hp:w.maxHp,maxHp:w.maxHp,atk:w.atk,xp:0};if(team.length<6)team.push(c);caught++;battle=null;closeModal();say(`Caught ${c.name}! ${team.length<6?'It joined your team.':'Your team is full, but your catch was recorded.'}`);coins+=2;updateHud()}else{showBattle();document.getElementById('battleText').textContent=`The ${w.name} popped out! Weaken it a little more and try again.`;document.getElementById('orbBtn').textContent=`🔮 Catch Orb (${items.orbs})`}}
function heal(){if(items.berries<=0){toast('No berries left!');return}items.berries--;let p=team[0];p.hp=Math.min(p.maxHp,p.hp+10);updateHud();showBattle();document.getElementById('battleText').textContent=`A berry restored ${p.name}'s energy.`}
function teamScreen(){let cards=team.map((c,i)=>`<div class="creature"><div class="emoji">${c.emoji}</div><b>${c.name}</b><small>${c.kind} · Level ${c.level}</small><div class="health"><span style="width:${100*c.hp/c.maxHp}%;"></span></div><small>${c.hp}/${c.maxHp} HP</small><div class="actions"><button class="ui-btn" data-heal="${i}">Rest (+5)</button>${i?`<button class="ui-btn" data-lead="${i}">Lead team</button>`:''}</div></div>`).join('');showModal(`<h2>♡ Your Team</h2><p class="muted">Your companions travel with you. Pick a lead creature and keep them healthy.</p><div class="cards">${cards}</div><div class="actions"><button class="ui-btn primary" id="restAll">Rest at camp · 4 shards</button><button class="ui-btn" id="closeTeam">Back to meadow</button></div>`);document.querySelectorAll('[data-heal]').forEach(b=>b.onclick=()=>{let c=team[+b.dataset.heal];c.hp=Math.min(c.maxHp,c.hp+5);updateHud();teamScreen()});document.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{let i=+b.dataset.lead;[team[0],team[i]]=[team[i],team[0]];updateHud();teamScreen();say(`${team[0].name} is now leading your team.`)});document.getElementById('restAll').onclick=()=>{if(coins<4){toast('You need 4 shards.');return}coins-=4;team.forEach(c=>c.hp=c.maxHp);updateHud();teamScreen();toast('Your team feels refreshed!')};document.getElementById('closeTeam').onclick=closeModal}
function bagScreen(){showModal(`<h2>▣ Adventurer's Bag</h2><p class="muted">Everything you need for your first expedition.</p><div class="cards"><div class="creature"><div class="emoji">🔮</div><b>Catch Orbs</b><small>${items.orbs} remaining</small><p class="muted">Used to befriend wild creatures.</p></div><div class="creature"><div class="emoji">🍓</div><b>Glowberries</b><small>${items.berries} remaining</small><p class="muted">Restore 10 HP during battle.</p></div><div class="creature"><div class="emoji">✦</div><b>Star Shards</b><small>${coins} in your pouch</small><p class="muted">A little currency for supplies.</p></div></div><div class="actions"><button class="ui-btn primary" id="buyOrb">Buy Catch Orb · 5 shards</button><button class="ui-btn" id="buyBerry">Buy Glowberry · 3 shards</button><button class="ui-btn" id="closeBag">Back</button></div>`);document.getElementById('buyOrb').onclick=()=>{if(coins>=5){coins-=5;items.orbs++;updateHud();bagScreen()}else toast('Not enough shards!')};document.getElementById('buyBerry').onclick=()=>{if(coins>=3){coins-=3;items.berries++;updateHud();bagScreen()}else toast('Not enough shards!')};document.getElementById('closeBag').onclick=closeModal}
function mapScreen(){showModal(`<h2>⌖ Velanora Field Map</h2><p class="muted">A small corner of a much bigger world. Explore routes to uncover new areas.</p><div style="height:235px;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(145deg,#72c8a0 0 32%,#9bd3a2 32% 52%,#e0d1a4 52% 58%,#65b6d4 58% 75%,#318a7b 75%);border:1px solid #ffffff33"><svg viewBox="0 0 500 235" width="100%" height="100%"><path d="M -10 210 Q 130 180 155 115 T 300 90 T 515 15" fill="none" stroke="#e8d6a6" stroke-width="27"/><path d="M -10 210 Q 130 180 155 115 T 300 90 T 515 15" fill="none" stroke="#f7e8c2" stroke-width="3"/><path d="M 20 40 Q 90 60 130 10 M 260 220 Q 350 175 440 205" fill="none" stroke="#3a9675" stroke-width="18"/>${[[70,90],[200,130],[320,70],[405,165],[365,28],[110,190]].map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===0?9:6}" fill="${i===0?'#fff':'#f8d978'}" stroke="#235a57" stroke-width="3"/>`).join('')}<text x="28" y="72" fill="#163f46" font-size="13" font-weight="bold">MOONPETAL</text><text x="285" y="52" fill="#163f46" font-size="13" font-weight="bold">OLD WOODS</text><text x="300" y="205" fill="#163f46" font-size="13" font-weight="bold">AZURE COAST</text></svg></div><p class="muted">📍 Current area: Moonpetal Meadow · Next: Old Woods</p><div class="actions"><button class="ui-btn primary" id="closeMap">Keep exploring</button></div>`);document.getElementById('closeMap').onclick=closeModal}
function interact(){if(modalOpen)return;let near=Math.hypot(player.x+150,player.y-90);if(near<90){showModal(`<h2>🪧 Meadow sign</h2><p>Welcome, new Wayfinder! Wild creatures love the tall grass. Walk around to encounter them, then use Catch Orbs to befriend them.</p><p class="muted">Tip: a creature with lower HP is easier to catch. Visit your bag to buy more supplies.</p><div class="actions"><button class="ui-btn primary" id="signClose">Let's go!</button></div>`);document.getElementById('signClose').onclick=closeModal}else if(Math.hypot(player.x-210,player.y+155)<130){coins+=2;updateHud();say('You found a shiny Star Shard beside the pond! +2 shards.');toast('+2 Star Shards')}else{say('Nothing nearby to interact with. Explore the tall grass to find wild creatures!')}}
document.getElementById('interact').onclick=interact;document.getElementById('teamBtn').onclick=teamScreen;document.getElementById('bagBtn').onclick=bagScreen;document.getElementById('mapBtn').onclick=mapScreen;document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal()});
function keyDown(e){let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k===' '||k==='e')interact();if(k==='t')teamScreen();if(k==='x')bagScreen();if(k==='m')mapScreen()}function keyUp(e){keys[e.key.toLowerCase()]=false}addEventListener('keydown',keyDown);addEventListener('keyup',keyUp);
let heldMove=null;document.querySelectorAll('[data-move]').forEach(b=>{const start=e=>{e.preventDefault();heldMove=b.dataset.move};const end=e=>{e.preventDefault();if(heldMove===b.dataset.move)heldMove=null};b.addEventListener('pointerdown',start);b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);b.addEventListener('pointerleave',end)});
let lastMove=0;function loop(t){if(!modalOpen&&t-lastMove>125){let dx=0,dy=0;if(keys.w||keys.arrowup||heldMove==='up')dy-=25;if(keys.s||keys.arrowdown||heldMove==='down')dy+=25;if(keys.a||keys.arrowleft||heldMove==='left')dx-=25;if(keys.d||keys.arrowright||heldMove==='right')dx+=25;if(dx||dy){move(dx,dy);lastMove=t}}requestAnimationFrame(loop)}requestAnimationFrame(loop);updateHud();
})();
</script></body></html>
